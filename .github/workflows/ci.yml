name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag url-shortener:ci .
      - name: Start container with persistent storage
        run: |
          docker volume create url-shortener-ci-data
          docker run --detach --name url-shortener-ci \
            --publish 8000:8000 \
            --volume url-shortener-ci-data:/data \
            url-shortener:ci
      - name: Wait for the API
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors \
            http://127.0.0.1:8000/docs > /dev/null
      - name: Verify private workspace, transfers, analytics, and public redirects
        run: |
          python3 - <<'PY'
          import csv
          import http.client
          import io
          import json
          from xml.etree import ElementTree

          token = None
          credentials = {"username": "smoke-user", "password": "smoke-test-password-123"}

          def request(method, path, body=None, *, private=True, content_type="application/json"):
              connection = http.client.HTTPConnection("127.0.0.1", 8000, timeout=10)
              headers = {"Content-Type": content_type}
              if private and token:
                  headers["Authorization"] = f"Bearer {token}"
              encoded = json.dumps(body) if body is not None and not isinstance(body, bytes) else body
              try:
                  connection.request(method, path, body=encoded, headers=headers)
                  response = connection.getresponse()
                  response_headers = {name.lower(): value for name, value in response.getheaders()}
                  return response.status, response_headers, response.read()
              finally:
                  connection.close()

          status, headers, body = request("GET", "/")
          assert status == 200 and "text/html" in headers.get("content-type", ""), (status, headers)
          assert b"<html" in body.lower(), body
          status, headers, body = request("GET", "/assets/app.js")
          assert status == 200 and "javascript" in headers.get("content-type", ""), (status, headers)
          assert body, "Dashboard JavaScript is empty."
          assert request("GET", "/links", private=False)[0] == 401

          status, _, body = request("POST", "/auth/register", credentials, private=False)
          assert status == 201, (status, body)
          token = json.loads(body)["access_token"]
          assert request("GET", "/auth/me")[0] == 200
          status, _, body = request("POST", "/links", {
              "url": "https://example.com/smoke", "alias": "smoke-link", "title": "Smoke test"
          })
          assert status == 201 and json.loads(body)["code"] == "smoke-link", (status, body)

          status, headers, body = request("GET", "/smoke-link", private=False)
          assert status == 302 and headers.get("location") == "https://example.com/smoke", (status, headers)
          status, _, body = request("GET", "/links/smoke-link/stats")
          assert status == 200, (status, body)
          stats = json.loads(body)
          assert stats["total_clicks"] == 1 and stats["last_clicked_at"] is not None, stats
          status, _, body = request("PATCH", "/links/smoke-link", {"is_active": False})
          assert status == 200 and json.loads(body)["is_active"] is False, (status, body)
          status, _, body = request("GET", "/smoke-link", private=False)
          assert status == 410 and "paused" in json.loads(body)["detail"].lower(), (status, body)
          assert json.loads(request("GET", "/links/smoke-link/stats")[2])["total_clicks"] == 1
          status, _, body = request("PATCH", "/links/smoke-link", {"is_active": True})
          assert status == 200 and json.loads(body)["is_active"] is True, (status, body)
          assert request("GET", "/smoke-link", private=False)[0] == 302

          status, headers, body = request("GET", "/links/smoke-link/qr.svg")
          assert status == 200 and "image/svg+xml" in headers.get("content-type", ""), (status, headers)
          assert ElementTree.fromstring(body).tag.endswith("svg")
          raw_csv = b"url,title,alias\nhttps://example.com/imported,Imported,batch-smoke\ninvalid,Rejected,\n"
          status, _, body = request("POST", "/links/bulk", raw_csv, content_type="text/csv")
          assert status == 200, (status, body)
          result = json.loads(body)
          assert result["created_count"] == result["error_count"] == 1, result
          assert [row["status"] for row in result["results"]] == [201, 422], result
          status, headers, body = request("GET", "/links/export.csv")
          assert status == 200 and "text/csv" in headers.get("content-type", ""), (status, headers)
          exported = list(csv.DictReader(io.StringIO(body.decode("utf-8-sig"))))
          assert {row["code"] for row in exported} == {"smoke-link", "batch-smoke"}, exported
          status, _, body = request("GET", "/links/overview?days=30")
          assert status == 200, (status, body)
          overview = json.loads(body)
          assert len(overview["daily_clicks"]) == 30 and overview["period_clicks"] == 2, overview
          status, _, body = request("GET", "/links/smoke-link/stats?days=90")
          assert status == 200, (status, body)
          stats = json.loads(body)
          assert len(stats["daily_clicks"]) == 90 and stats["total_clicks"] == 2, stats
          print("Authentication, public redirects, pause/resume, QR, CSV, and analytics passed.")
          PY
      - name: Restart container and verify account and link persistence
        run: |
          docker restart url-shortener-ci
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors \
            http://127.0.0.1:8000/docs > /dev/null
          python3 - <<'PY'
          import json
          from urllib.request import Request, urlopen

          credentials = {"username": "smoke-user", "password": "smoke-test-password-123"}
          login = Request(
              "http://127.0.0.1:8000/auth/login",
              data=json.dumps(credentials).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(login, timeout=10) as response:
              token = json.load(response)["access_token"]
          stats_request = Request(
              "http://127.0.0.1:8000/links/smoke-link/stats",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urlopen(stats_request, timeout=10) as response:
              assert response.status == 200, response.status
              stats = json.load(response)
          assert stats["code"] == "smoke-link" and stats["url"] == "https://example.com/smoke", stats
          assert stats["total_clicks"] == stats["period_clicks"] == 2, stats
          assert stats["last_clicked_at"] is not None, stats
          print("Account, ownership, link, and click statistics persisted after restart.")
          PY
      - name: Show container logs on failure
        if: failure()
        run: docker logs url-shortener-ci 2>&1 || true
      - name: Clean up
        if: always()
        run: |
          docker rm --force url-shortener-ci || true
          docker volume rm url-shortener-ci-data || true
