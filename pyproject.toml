[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shortlink-api"
version = "2.0.0"
description = "A small, reliable URL shortener built with FastAPI and SQLite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162,<0.163",
    "pydantic>=2.14,<3",
    "starlette>=1.10,<2",
    "uvicorn[standard]>=0.54,<0.55",
    "qrcode>=8.2,<9",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16,<3",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
